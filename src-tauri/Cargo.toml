[package]
name = "packetcode-gui"
version = "0.1.0"
description = "Desktop client for the packetcode coding agent"
authors = ["Ian Walmsley"]
edition = "2021"
license = "MIT"

[lib]
name = "packetcode_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
